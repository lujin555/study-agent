name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 测试全部 mock 了真实 API，给哑值即可；llm.py import 时只检查非空
      LLM_API_KEY: ci-dummy-key
      LLM_BASE_URL: https://api.deepseek.com/v1
      ACCESS_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU torch first
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      # 测试会 import rag.store，导入时就加载向量模型；CI 没有本地 models/，
      # 先下载（config 自动探测会命中 models/BAAI/bge-small-zh-v1.5）
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/
          key: bge-small-zh-v1.5

      - name: Download embedding model
        run: python download_model.py
        env:
          HF_ENDPOINT: https://huggingface.co

      # 必须用 python -m pytest：直接把仓库根目录加进 sys.path；
      # 用 pytest 控制台脚本会报 ModuleNotFoundError: No module named 'agent'
      - name: Run tests with coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing
